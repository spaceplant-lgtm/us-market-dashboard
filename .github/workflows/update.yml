name: Update market data

on:
  schedule:
    # 미국 정규장 마감 후 화~토 07:07~15:37 KST 사이 30분 간격(18회).
    # GitHub 예약 실행은 수 시간 지연·누락될 수 있어 촘촘히 배치함.
    # 이미 최신 기준일이면 스크립트가 즉시 종료하므로 중복 실행 부담은 작음.
    - cron: "7,37 22-23 * * 1-5"
    - cron: "7,37 0-6 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build data.json
        run: python scripts/build_data.py
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "변경 없음 (휴장일 등)"
          else
            git commit -m "data: $(date -u +%Y-%m-%d) update"
            git push
          fi
