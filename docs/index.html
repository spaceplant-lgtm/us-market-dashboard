<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미국 주식 수익률 대시보드</title>
<style>
  :root {
    --bg: #f4f3f0; --surface: #fcfcfb; --line: #e3e1dc; --ink: #1c1c1a; --ink2: #5c5b57; --ink3: #8d8b85;
    --accent: #1c1c1a; --hl: #fff3c4;
    --warm: 214, 69, 61;   /* 빨강 */
    --cool: 47, 107, 208;  /* 파랑 */
    --green: 22, 150, 84;
    --up: var(--warm); --down: var(--cool);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211; --surface: #1a1a19; --line: #30302d; --ink: #ecebe7; --ink2: #b0aea8; --ink3: #7d7b76;
      --accent: #ecebe7; --hl: #4a401a;
      --warm: 240, 106, 96; --cool: 98, 152, 245; --green: 60, 190, 120;
    }
  }
  body[data-color="us"] { --up: var(--green); --down: var(--warm); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif; }
  .wrap { max-width: 1680px; margin: 0 auto; padding: 20px 20px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .asof { color: var(--ink2); font-size: 13px; }
  .asof b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .controls { margin-left: auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: none; color: var(--ink2); font: inherit; padding: 7px 14px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 600; }
  .seg.small button { padding: 5px 10px; font-size: 12px; }
  h2 { font-size: 15px; margin: 22px 0 8px; display: flex; align-items: baseline; gap: 8px; }
  h2 small { font-weight: 400; color: var(--ink3); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(210px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; }
  .col { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; scroll-snap-align: start; min-width: 0; }
  .col-head { padding: 9px 12px 8px; border-bottom: 1px solid var(--line); }
  .col-head .p { font-weight: 700; font-size: 14px; }
  .col-head .base { color: var(--ink3); font-size: 11px; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .col-head .st { color: var(--ink2); font-size: 11.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  ol { list-style: none; margin: 0; padding: 0; }
  li a { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 6px; align-items: center;
    padding: 4px 8px 4px 8px; color: inherit; text-decoration: none; border-bottom: 1px solid transparent; }
  li + li a { border-top: 1px solid var(--line); }
  li a:hover, li.hl a { background: var(--hl); }
  .rk { color: var(--ink3); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
  .nm { min-width: 0; }
  .tk { font-weight: 650; font-size: 13px; letter-spacing: 0.01em; }
  .co { display: block; color: var(--ink3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }
  .rt { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; padding: 2px 6px; border-radius: 5px; min-width: 68px; text-align: right;
    background: rgba(var(--c), var(--a)); }
  .empty { padding: 18px 12px; color: var(--ink3); font-size: 12px; }
  footer { margin-top: 24px; color: var(--ink3); font-size: 12px; line-height: 1.6; }
  footer a { color: var(--ink2); }
  details { margin-top: 6px; } details p { margin: 4px 0; word-break: break-all; }
  #msg { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; color: var(--ink2); }
  .stale { color: rgb(var(--warm)); font-weight: 600; }
  @media (max-width: 720px) { .wrap { padding: 14px 12px 40px; } .controls { margin-left: 0; } .grid { grid-template-columns: repeat(5, 78vw); } }
</style>
</head>
<body data-color="kr">
<div class="wrap">
  <header>
    <div>
      <h1>미국 주식 수익률 대시보드</h1>
      <div class="asof" id="asof">데이터 불러오는 중…</div>
    </div>
    <div class="controls">
      <div class="seg" id="idxTabs" role="group" aria-label="지수 선택"></div>
      <div class="seg small" id="colorTabs" role="group" aria-label="색상 기준">
        <button data-c="kr" title="상승 빨강 / 하락 파랑">한국식 색</button>
        <button data-c="us" title="상승 초록 / 하락 빨강">미국식 색</button>
      </div>
    </div>
  </header>
  <main id="main"><div id="msg">데이터 불러오는 중…</div></main>
  <footer id="foot"></footer>
</div>
<script>
(function () {
  "use strict";
  var DATA = null, cur = "sp500";
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pct(v, d) { if (v == null) return "–"; var s = Math.abs(v).toFixed(d == null ? 2 : d);
    return (v > 0 ? "+" : v < 0 ? "−" : "") + s + "%"; }
  function md(s) { return s ? s.slice(5).replace("-", "/") : ""; }

  function list(rows, scale) {
    if (!rows || !rows.length) return '<div class="empty">데이터 없음</div>';
    return "<ol>" + rows.map(function (r, i) {
      var a = Math.min(0.42, 0.07 + 0.35 * Math.sqrt(Math.abs(r.r) / scale));
      var c = r.r > 0 ? "var(--up)" : r.r < 0 ? "var(--down)" : "128,128,128";
      var tip = r.n + (r.s ? " · " + r.s : "") + " · 종가 $" + r.c.toLocaleString("en-US", { minimumFractionDigits: 2 });
      return '<li data-t="' + esc(r.y) + '"><a href="https://finance.yahoo.com/quote/' + encodeURIComponent(r.y) +
        '" target="_blank" rel="noopener" title="' + esc(tip) + '"><span class="rk">' + (i + 1) +
        '</span><span class="nm"><span class="tk">' + esc(r.t) + '</span><span class="co">' + esc(r.n) +
        '</span></span><span class="rt" style="--c:' + c + ";--a:" + a.toFixed(3) + '">' + pct(r.r) + "</span></a></li>";
    }).join("") + "</ol>";
  }

  function section(title, sub, side, ix) {
    var cols = DATA.periods.map(function (p) {
      var rows = ix[side][p.key] || [], st = ix.stats[p.key] || {};
      var scale = Math.max.apply(null, rows.map(function (r) { return Math.abs(r.r); }).concat([0.01]));
      var up = st.n ? Math.round(st.up / st.n * 100) : null;
      return '<div class="col"><div class="col-head"><span class="p">' + esc(p.label) + '</span><span class="base">' +
        md(p.base) + " → " + md(DATA.asof) + '</span><div class="st">중앙값 ' + pct(st.median) +
        " · 상승 " + (up == null ? "–" : up + "%") + " (" + (st.n || 0) + "종목)</div></div>" + list(rows, scale) + "</div>";
    }).join("");
    return "<h2>" + title + " <small>" + sub + '</small></h2><div class="grid">' + cols + "</div>";
  }

  function render() {
    var ix = DATA.indices[cur], n = DATA.top_n || 20;
    $("main").innerHTML = section("상승률 Top " + n, "수익률 높은 순", "top", ix) +
                          section("하락률 Bottom " + n, "수익률 낮은 순", "bottom", ix);
    Array.prototype.forEach.call($("idxTabs").children, function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.k === cur)); });
    var miss = ix.missing || [];
    $("foot").innerHTML =
      "<div><b>" + esc(ix.label) + "</b> 구성종목 " + ix.constituents + "개 중 " + ix.priced + "개 가격 수집 · 구성종목 출처: " +
      '<a href="' + esc(ix.source_url) + '" target="_blank" rel="noopener">' + esc(ix.source) + "</a> · 가격: Yahoo Finance 수정주가(배당·분할 반영)</div>" +
      "<div>1일 = 직전 거래일 종가 대비. 1주·1·3·6개월 = 달력 기준 해당 시점 이전 마지막 거래일 종가 대비. " +
      "각 열 머리의 중앙값·상승 비율은 해당 지수 전체 구성종목 기준. 러셀 2000은 iShares IWM ETF 보유종목을 대용치로 사용.</div>" +
      (miss.length ? "<details><summary>가격 미수집 " + miss.length + "종목 (순위에서 제외)</summary><p>" + esc(miss.join(", ")) + "</p></details>" : "") +
      "<div>무료 데이터 기반 참고용 화면이며 오류·지연이 있을 수 있음. 투자 판단 전 원자료 확인 필요.</div>";
  }

  function head() {
    var gen = new Date(DATA.generated_utc), ageDays = (Date.now() - gen.getTime()) / 864e5;
    var kst = gen.toLocaleString("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    $("asof").innerHTML = "기준일(미국 종가) <b>" + esc(DATA.asof) + "</b> · 갱신 " + esc(kst) + " KST" +
      (ageDays > 4 ? ' · <span class="stale">갱신이 ' + Math.floor(ageDays) + "일 전 — 자동 실행 상태 확인 필요</span>" : "");
    $("idxTabs").innerHTML = Object.keys(DATA.indices).map(function (k) {
      return '<button data-k="' + k + '">' + esc(DATA.indices[k].label) + "</button>"; }).join("");
  }

  function setColor(c) {
    document.body.dataset.color = c; store.set("umd.color", c);
    Array.prototype.forEach.call($("colorTabs").children, function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.c === c)); });
  }

  $("idxTabs").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    cur = b.dataset.k; store.set("umd.idx", cur); render(); });
  $("colorTabs").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (b) setColor(b.dataset.c); });
  // 같은 종목이 여러 기간에 등장하면 함께 강조
  function mark(t) {
    Array.prototype.forEach.call(document.querySelectorAll("li.hl"), function (x) { x.classList.remove("hl"); });
    if (!t) return;
    Array.prototype.forEach.call(document.querySelectorAll("li[data-t]"), function (x) {
      if (x.dataset.t === t) x.classList.add("hl"); });
  }
  $("main").addEventListener("mouseover", function (e) { var li = e.target.closest("li[data-t]"); mark(li ? li.dataset.t : null); });
  $("main").addEventListener("mouseleave", function () { mark(null); });

  setColor(store.get("umd.color") === "us" ? "us" : "kr");
  fetch("data.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (d) {
      DATA = d; var saved = store.get("umd.idx");
      cur = saved && d.indices[saved] ? saved : Object.keys(d.indices)[0];
      head(); render(); })
    .catch(function (err) {
      $("asof").textContent = "데이터 없음";
      $("msg").innerHTML = "<b>data.json을 불러오지 못했습니다.</b><br>GitHub 저장소의 Actions 탭에서 " +
        "“Update market data” 워크플로를 한 번 실행(Run workflow)하면 데이터가 생성됩니다.<br><small>" + esc(err.message) + "</small>";
    });
})();
</script>
</body>
</html>
