name: Update market data

on:
  schedule:
    # 미국 정규장 마감(서머타임 20:00 / 표준시 21:00 UTC) 이후, 화~토 한국시간 기준 3회 실행.
    # GitHub 예약 실행은 지연·누락될 수 있어 중복 배치함(같은 기준일이면 결과 동일).
    - cron: "37 22 * * 1-5"   # 07:37 KST
    - cron: "37 0 * * 2-6"    # 09:37 KST
    - cron: "7 3 * * 2-6"     # 12:07 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build data.json
        run: python scripts/build_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "변경 없음 (휴장일 등)"
          else
            git commit -m "data: $(date -u +%Y-%m-%d) update"
            git push
          fi
